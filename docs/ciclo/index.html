<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ciclo de Estudos | Study Hub TI</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#101b25;color:#edf2ef;font:17px/1.65 system-ui,sans-serif}a{color:#b9ed9d}a:hover{text-decoration:underline}header,main,footer{max-width:1100px;margin:auto;padding:28px}nav{display:flex;gap:22px;flex-wrap:wrap}nav a{text-decoration:none}header{display:flex;justify-content:space-between;gap:24px;border-bottom:1px solid #3c4c56}.eyebrow{color:#b9ed9d;text-transform:uppercase;letter-spacing:.15em;font-size:13px}h1{font-size:clamp(40px,6vw,76px);line-height:1.05;letter-spacing:-.05em;max-width:850px}h2{font-size:32px;line-height:1.2}h3{font-size:23px}p{max-width:720px}.hero{padding:60px 0}.muted{color:#b7c5cc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}article,.panel{padding:28px;background:#192a36;border:1px solid #344955;border-radius:12px}section{padding:30px 0}.button,button{display:inline-block;background:#b9ed9d;color:#122319;border:0;padding:12px 19px;border-radius:5px;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}.outline{background:transparent;color:#b9ed9d;border:1px solid #b9ed9d}footer{border-top:1px solid #3c4c56;font-size:14px}input,select{display:block;width:100%;background:#101b25;color:white;border:1px solid #69818e;border-radius:5px;padding:12px;font:inherit}label{display:block;margin-bottom:16px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f4c466;outline-offset:4px}.session{display:flex;justify-content:space-between;gap:15px;padding:16px 0;border-bottom:1px solid #52616b}#message{color:#f4c466;min-height:1.5em}@media(max-width:650px){header{display:block}.grid{grid-template-columns:1fr}main,header,footer{padding:20px}h1{font-size:44px}.hero{padding:35px 0}.session{flex-wrap:wrap}}</style></head><body><header><strong>STUDY HUB / CICLO</strong><a href="../">← Portfólio</a></header><main><div class="eyebrow">Projeto pessoal</div><h1>Seu próximo ciclo.</h1><p class="muted">Organize as sessões da semana. O planejamento fica salvo neste navegador quando o armazenamento está disponível.</p><div class="grid"><section class="panel"><h2>Adicionar sessão</h2><form id="form"><label>Disciplina<input id="subject" maxlength="80" required placeholder="Ex.: Banco de Dados"></label><label>Dia<select id="day"><option>Segunda</option><option>Terça</option><option>Quarta</option><option>Quinta</option><option>Sexta</option><option>Sábado</option><option>Domingo</option></select></label><label>Duração em minutos<input id="minutes" type="number" min="10" max="240" step="1" value="50" required></label><button>Adicionar sessão</button></form><p id="message" role="status" aria-live="polite"></p></section><section class="panel"><h2>Planejamento</h2><p id="total" aria-live="polite"></p><div id="list"></div><p><button id="export" type="button" class="outline">Exportar JSON</button></p><button id="clear" type="button" class="outline">Limpar ciclo</button></section></div></main><footer>Dados locais · Sem cadastro · Study Hub TI</footer><script>
const key='study-hub-ciclo-v1', days=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
let sessions=[]; const el=id=>document.getElementById(id);function warn(t){el('message').textContent=t;}
try{const data=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(data))sessions=data.filter(s=>s&&typeof s.subject==='string'&&s.subject.trim()&&s.subject.length<=80&&days.includes(s.day)&&Number.isInteger(s.minutes)&&s.minutes>=10&&s.minutes<=240);}catch(e){warn('Não foi possível recuperar os dados locais. Você pode iniciar um novo ciclo.');}
function save(){try{localStorage.setItem(key,JSON.stringify(sessions));warn('Planejamento salvo neste navegador.');}catch(e){warn('Armazenamento indisponível: os dados serão mantidos apenas nesta sessão.');}}
function render(){el('list').replaceChildren();let total=sessions.reduce((n,s)=>n+s.minutes,0);el('total').textContent=`${sessions.length} sessões · ${Math.floor(total/60)}h ${total%60}min por semana`;if(!sessions.length){el('list').textContent='Nenhuma sessão adicionada.';return;}sessions.forEach((s,i)=>{let row=document.createElement('div');row.className='session';let text=document.createElement('span');text.textContent=`${s.day} · ${s.subject} · ${s.minutes} min`;let b=document.createElement('button');b.type='button';b.className='outline';b.textContent='Remover';b.setAttribute('aria-label',`Remover ${s.subject} de ${s.day}`);b.onclick=()=>{sessions.splice(i,1);save();render();};row.append(text,b);el('list').append(row);});}
el('form').onsubmit=e=>{e.preventDefault();let subject=el('subject').value.trim(),minutes=Number(el('minutes').value);if(!subject||!Number.isInteger(minutes)||minutes<10||minutes>240){warn('Informe a disciplina e uma duração inteira de 10 a 240 minutos.');return;}sessions.push({subject,day:el('day').value,minutes});save();render();el('subject').value='';el('subject').focus();};
el('clear').onclick=()=>{if(sessions.length&&confirm('Apagar todas as sessões deste ciclo?')){sessions=[];save();render();}};
el('export').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify(sessions,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='ciclo-estudos.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};render();
</script></body></html>
